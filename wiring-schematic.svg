<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">MyWhoosh nice!nano-compatible nRF52840 controller wiring schematic</title>
  <desc id="desc">A protected rechargeable LiPo connects through an optional two-pin connector to the controller battery pads. Four normally-open buttons connect Pro Micro pins D2 through D5 to a shared ground.</desc>
  <defs>
    <style>
      .module { fill:#f8fafc; stroke:#172033; stroke-width:3; }
      .submodule { fill:#eef2ff; stroke:#6366f1; stroke-width:2; }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
      .label { font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#111827; }
      .small { font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#334155; }
      .pin { font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#111827; }
      .power { fill:none; stroke:#dc2626; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .ground { fill:none; stroke:#111827; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .signal { fill:none; stroke:#2563eb; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .usb { fill:none; stroke:#7c3aed; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .thin { fill:none; stroke:#172033; stroke-width:3; stroke-linecap:round; }
      .node-red { fill:#dc2626; }
      .node-black { fill:#111827; }
      .node-blue { fill:#2563eb; }
      .callout { fill:#fff7ed; stroke:#ea580c; stroke-width:2; }
      .info { fill:#eff6ff; stroke:#2563eb; stroke-width:2; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text class="title" x="40" y="50">POWER AND CHARGING — NICE!NANO V2-COMPATIBLE BOARD</text>

  <rect class="module" x="40" y="105" width="260" height="170" rx="14"/>
  <text class="label" x="170" y="150" text-anchor="middle">Protected LiPo</text>
  <text class="label" x="170" y="182" text-anchor="middle">3.7 V rechargeable</text>
  <text class="small" x="170" y="216" text-anchor="middle">Reference: 301230 / 100 mAh</text>
  <text class="pin" x="272" y="132" fill="#dc2626">+</text>
  <text class="pin" x="272" y="258">−</text>

  <rect class="module" x="380" y="125" width="190" height="130" rx="14"/>
  <text class="label" x="475" y="165" text-anchor="middle">2-pin pigtail</text>
  <text class="small" x="475" y="195" text-anchor="middle">optional disconnect</text>
  <text class="small" x="475" y="225" text-anchor="middle">verify polarity</text>

  <rect class="module" x="670" y="80" width="850" height="250" rx="16"/>
  <text class="title" x="1095" y="125" text-anchor="middle">nRF52840 nice!nano v2-compatible controller</text>
  <rect class="submodule" x="735" y="155" width="270" height="115" rx="12"/>
  <text class="label" x="870" y="195" text-anchor="middle">Onboard LiPo charger</text>
  <text class="small" x="870" y="226" text-anchor="middle">normal setting ≈ 100 mA</text>
  <text class="small" x="870" y="250" text-anchor="middle">do not bridge BOOST</text>
  <rect class="submodule" x="1080" y="155" width="260" height="115" rx="12"/>
  <text class="label" x="1210" y="195" text-anchor="middle">nRF52840 + ZMK</text>
  <text class="small" x="1210" y="226" text-anchor="middle">BLE HID • deep sleep</text>
  <text class="small" x="1210" y="250" text-anchor="middle">battery reporting</text>
  <rect x="1400" y="169" width="78" height="50" rx="10" fill="#fff" stroke="#172033" stroke-width="3"/>
  <rect x="1417" y="182" width="44" height="24" rx="10" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text class="pin" x="1439" y="249" text-anchor="middle" fill="#7c3aed">USB-C</text>
  <text class="pin" x="685" y="128" fill="#dc2626">B+</text>
  <text class="pin" x="685" y="302">B−</text>

  <path class="power" d="M300 122 H380 M570 145 H670"/>
  <path class="ground" d="M300 255 H380 M570 235 H670"/>
  <circle class="node-red" cx="300" cy="122" r="7"/>
  <circle class="node-red" cx="670" cy="145" r="7"/>
  <circle class="node-black" cx="300" cy="255" r="7"/>
  <circle class="node-black" cx="670" cy="235" r="7"/>
  <path class="power" d="M670 145 H735"/>
  <path class="ground" d="M670 235 H735"/>
  <path class="usb" d="M1400 194 H1370 V295 H870 V270"/>

  <rect class="callout" x="40" y="310" width="560" height="70" rx="12"/>
  <text class="label" x="320" y="340" text-anchor="middle" fill="#c2410c">Rechargeable 3.7 V LiPo only</text>
  <text class="small" x="320" y="366" text-anchor="middle">Never connect a CR2032 or other primary cell to the charger.</text>
  <rect class="info" x="670" y="350" width="850" height="50" rx="12"/>
  <text class="small" x="1095" y="382" text-anchor="middle">No TP4056, boost converter, external wake resistor, or separate 5 V supply</text>

  <line x1="40" y1="430" x2="1560" y2="430" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 10"/>
  <text class="title" x="40" y="480">BUTTON INPUTS — FOUR-BUTTON CONTROLLER</text>
  <text class="small" x="40" y="512">Each normally-open switch shorts one input to shared GND. Internal pull-ups and wake-on-input are configured by ZMK.</text>

  <path class="ground" d="M160 790 H1440 V925 H1380"/>
  <text class="pin" x="55" y="797">shared GND</text>

  <path class="signal" d="M285 630 V835"/>
  <path class="signal" d="M620 630 V835"/>
  <path class="signal" d="M955 630 V835"/>
  <path class="signal" d="M1290 630 V835"/>

  <g>
    <path class="signal" d="M285 630 H335"/><circle cx="335" cy="630" r="7" fill="#fff" stroke="#172033" stroke-width="3"/>
    <circle cx="385" cy="630" r="7" fill="#fff" stroke="#172033" stroke-width="3"/><path class="thin" d="M341 622 L377 605"/><path class="ground" d="M385 637 V790"/>
    <path class="signal" d="M620 630 H670"/><circle cx="670" cy="630" r="7" fill="#fff" stroke="#172033" stroke-width="3"/>
    <circle cx="720" cy="630" r="7" fill="#fff" stroke="#172033" stroke-width="3"/><path class="thin" d="M676 622 L712 605"/><path class="ground" d="M720 637 V790"/>
    <path class="signal" d="M955 630 H1005"/><circle cx="1005" cy="630" r="7" fill="#fff" stroke="#172033" stroke-width="3"/>
    <circle cx="1055" cy="630" r="7" fill="#fff" stroke="#172033" stroke-width="3"/><path class="thin" d="M1011 622 L1047 605"/><path class="ground" d="M1055 637 V790"/>
    <path class="signal" d="M1290 630 H1340"/><circle cx="1340" cy="630" r="7" fill="#fff" stroke="#172033" stroke-width="3"/>
    <circle cx="1390" cy="630" r="7" fill="#fff" stroke="#172033" stroke-width="3"/><path class="thin" d="M1346 622 L1382 605"/><path class="ground" d="M1390 637 V790"/>
  </g>

  <text class="label" x="285" y="690" text-anchor="middle">STEER LEFT  ←</text>
  <text class="pin" x="285" y="722" text-anchor="middle" fill="#2563eb">D2 / P0.17</text>
  <text class="label" x="620" y="690" text-anchor="middle">SHIFT DOWN  −</text>
  <text class="pin" x="620" y="722" text-anchor="middle" fill="#2563eb">D3 / P0.20</text>
  <text class="label" x="955" y="690" text-anchor="middle">SHIFT UP  +</text>
  <text class="pin" x="955" y="722" text-anchor="middle" fill="#2563eb">D4 / P0.22</text>
  <text class="label" x="1290" y="690" text-anchor="middle">STEER RIGHT  →</text>
  <text class="pin" x="1290" y="722" text-anchor="middle" fill="#2563eb">D5 / P0.24</text>

  <rect class="module" x="100" y="835" width="1400" height="130" rx="14"/>
  <text class="title" x="800" y="900" text-anchor="middle">nice!nano v2-compatible nRF52840 board</text>
  <text class="small" x="800" y="934" text-anchor="middle">ZMK BLE keyboard • 30 ms debounce • 15-minute deep sleep • every control wakes</text>
  <circle class="node-blue" cx="285" cy="835" r="8"/>
  <circle class="node-blue" cx="620" cy="835" r="8"/>
  <circle class="node-blue" cx="955" cy="835" r="8"/>
  <circle class="node-blue" cx="1290" cy="835" r="8"/>
  <circle class="node-black" cx="1380" cy="925" r="8"/>
  <text class="pin" x="285" y="864" text-anchor="middle">D2</text>
  <text class="pin" x="620" y="864" text-anchor="middle">D3</text>
  <text class="pin" x="955" y="864" text-anchor="middle">D4</text>
  <text class="pin" x="1290" y="864" text-anchor="middle">D5</text>
  <text class="pin" x="1380" y="950" text-anchor="middle">GND</text>

  <circle class="node-black" cx="385" cy="790" r="7"/>
  <circle class="node-black" cx="720" cy="790" r="7"/>
  <circle class="node-black" cx="1055" cy="790" r="7"/>
  <circle class="node-black" cx="1390" cy="790" r="7"/>

  <text class="small" x="40" y="990">Two-button variant: omit D2 and D5. Use D3 for Shift Down and D4 for Shift Up.</text>
</svg>
